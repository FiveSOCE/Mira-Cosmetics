effects:
  teleport:
    enabled: true
    default-cosmetic: teleport_mira
    ring-points: 36
    ring-radius: 1.0
    ring-spacing: 0.55
    base-y-offset: 0.15
  fly:
    enabled: true
    default-cosmetic: fly_white
    throttle-millis: 100
    count: 2
    y-offset: -0.15
    dust-size: 0.8
  trail:
    enabled: true
    throttle-millis: 250
  join:
    enabled: true
  kill:
    enabled: true

# Every event can independently enable/disable visuals and audio.
# Audio selections are intentionally blank until the sound pass is approved.
events:
  teleport_warmup:
    visual: { enabled: true, duration-ticks: 80 }
    audio: { enabled: false, sound: "" }
  teleport_complete:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }

  faction_claim:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }
  faction_unclaim:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }
  safezone_enter:
