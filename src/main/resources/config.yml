effects:
  teleport:
    enabled: true
    default-cosmetic: teleport_mira
    ring-points: 36
    ring-radius: 1.0
    ring-spacing: 0.55
    base-y-offset: 0.15
    audio-radius: 16.0
    visual:
      enabled: true
  fly:
    enabled: true
    default-cosmetic: fly_white
    throttle-millis: 75
    count: 8
    y-offset: -0.10
    behind-distance: 0.45
    spread-horizontal: 0.28
    spread-vertical: 0.10
    dust-size: 1.35
  trail:
    enabled: true
    throttle-millis: 250
  join:
    enabled: true
  kill:
    enabled: true

# Visual and audio are always independently configurable.
# Player master toggles live in /cosmetics and persist in cosmetics.yml.
events:
  teleport_warmup:
    visual: { enabled: true, duration-ticks: 80 }
    audio:
      enabled: true
      sound: BLOCK_BEACON_POWER_SELECT
      volume: 0.65
      pitch: 0.8
      progress:
        enabled: true
        sound: BLOCK_NOTE_BLOCK_PLING
        volume: 0.35
        interval-ticks: 12
        pitches: [0.9, 1.0, 1.15, 1.3, 1.5]
  teleport_complete:
    visual: { enabled: true }
    audio: { enabled: true, sound: ENTITY_ENDERMAN_TELEPORT, volume: 0.8, pitch: 1.1 }
  teleport_cancel:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_BEACON_DEACTIVATE, volume: 0.6, pitch: 0.8 }

  player_kill:
    visual: { enabled: false }
    audio: { enabled: true, sound: ENTITY_PLAYER_LEVELUP, volume: 0.55, pitch: 0.75 }
  combat_tag_start:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_RESPAWN_ANCHOR_CHARGE, volume: 0.8, pitch: 0.65 }
  combat_tag_end:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_BEACON_DEACTIVATE, volume: 0.55, pitch: 1.4 }
  ability_proc:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_NOTE_BLOCK_PLING, volume: 0.35, pitch: 1.65 }
  bounty_placed:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_BELL_USE, volume: 0.8, pitch: 0.65 }
  bounty_received:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_BELL_USE, volume: 0.9, pitch: 0.5 }
  bounty_claimed:
    visual: { enabled: false }
    audio: { enabled: true, sound: ENTITY_PLAYER_LEVELUP, volume: 0.8, pitch: 1.15 }
  bounty_claimed_large:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_END_PORTAL_SPAWN, volume: 1.0, pitch: 1.0 }

  faction_claim:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }
  faction_unclaim:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }
  safezone_enter:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }
  warzone_enter:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }
  faction_create:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }
  faction_upgrade:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }
  faction_disband:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }

  outpost_started:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_BEACON_ACTIVATE, volume: 0.9, pitch: 0.8 }
  outpost_capture_started:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_RESPAWN_ANCHOR_CHARGE, volume: 0.7, pitch: 1.1 }
  outpost_contested:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_BELL_USE, volume: 0.9, pitch: 0.7 }
  outpost_contested_pulse:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_BELL_USE, volume: 0.45, pitch: 1.0, cooldown-millis: 10000 }
  outpost_captured:
    visual: { enabled: true }
    audio: { enabled: true, sound: UI_TOAST_CHALLENGE_COMPLETE, volume: 1.0, pitch: 1.0 }
  outpost_stopped:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_BEACON_DEACTIVATE, volume: 0.8, pitch: 0.8 }

  crate_open:
    visual: { enabled: true }
    audio:
      enabled: true
      sound: ""
      progress:
        enabled: true
        sound: BLOCK_NOTE_BLOCK_PLING
        volume: 0.35
        interval-ticks: 12
        pitches: [0.7, 0.85, 1.0, 1.2, 1.4, 1.6, 1.8]
  crate_spin_tick:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_NOTE_BLOCK_HAT, volume: 0.24, pitch: 1.35 }

  crate_reward_common:
    visual: { enabled: true }
    audio: { enabled: true, sound: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.55, pitch: 1.15 }
  crate_reward_rare:
    visual: { enabled: true }
    audio: { enabled: true, sound: ENTITY_PLAYER_LEVELUP, volume: 0.7, pitch: 1.25 }
  crate_reward_legendary:
    visual: { enabled: true }
    audio:
      enabled: true
      sound: UI_TOAST_CHALLENGE_COMPLETE
      volume: 1.0
      pitch: 1.0
      secondary:
        sound: ENTITY_FIREWORK_ROCKET_LARGE_BLAST
        volume: 0.65
        pitch: 1.15

  pinata_spawn:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }
  pinata_hit:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }
  pinata_low_health:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }
  pinata_death:
    visual: { enabled: true }
    audio: { enabled: false, sound: "" }

  kit_claim:
    visual: { enabled: true }
    audio: { enabled: true, sound: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.55, pitch: 1.25 }
  kit_temp_claim:
    visual: { enabled: true }
    audio: { enabled: true, sound: ENTITY_PLAYER_LEVELUP, volume: 0.55, pitch: 1.35 }
  kit_event_claim:
    visual: { enabled: false }
    audio: { enabled: true, sound: ENTITY_PLAYER_LEVELUP, volume: 0.65, pitch: 0.95 }
  kit_error:
    visual: { enabled: false }
    audio: { enabled: true, sound: UI_BUTTON_CLICK, volume: 0.4, pitch: 0.6 }

  tag_equip:
    visual: { enabled: false }
    audio: { enabled: true, sound: BLOCK_NOTE_BLOCK_PLING, volume: 0.4, pitch: 1.5 }
  tag_remove:
    visual: { enabled: false }
    audio: { enabled: true, sound: UI_BUTTON_CLICK, volume: 0.35, pitch: 0.8 }
  tag_unlock:
    visual: { enabled: false }
    audio: { enabled: true, sound: ENTITY_PLAYER_LEVELUP, volume: 0.65, pitch: 1.4 }
  tag_milestone_unlock:
    visual: { enabled: false }
    audio: { enabled: true, sound: UI_TOAST_CHALLENGE_COMPLETE, volume: 0.65, pitch: 1.2 }

  economy_purchase:
    visual: { enabled: false }
    audio: { enabled: true, sound: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.35, pitch: 1.2 }
  economy_sale:
    visual: { enabled: false }
    audio: { enabled: true, sound: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.35, pitch: 1.5 }
  economy_bulk_sale:
    visual: { enabled: false }
    audio: { enabled: true, sound: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.5, pitch: 0.9 }
  sellwand_sale:
    visual: { enabled: false }
    audio: { enabled: true, sound: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.55, pitch: 1.6 }
  auction_listing:
    visual: { enabled: false }
    audio: { enabled: true, sound: UI_BUTTON_CLICK, volume: 0.4, pitch: 1.2 }
  auction_sold:
    visual: { enabled: false }
    audio: { enabled: true, sound: ENTITY_PLAYER_LEVELUP, volume: 0.5, pitch: 1.45 }
  auction_purchase:
    visual: { enabled: false }
    audio: { enabled: true, sound: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.45, pitch: 1.15 }
  collector_sale:
    visual: { enabled: false }
    audio: { enabled: true, sound: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.45, pitch: 1.3, cooldown-millis: 750 }

messages:
  prefix: '&5&lMira &8&l>> &r'
