name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MiraCosmetics-0.1.8
          path: build/libs/MiraCosmetics-0.1.8.jar
          if-no-files-found: error

      - name: Publish v0.1.8 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.8 >/dev/null 2>&1; then
            gh release create v0.1.8 \
              build/libs/MiraCosmetics-0.1.8.jar \
              --target "${{ github.sha }}" \
              --title "MiraCosmetics v0.1.8" \
              --notes "Hotfixes silent existing installations by merging missing audio config defaults without overwriting admin edits, adds explicit visual-only and server-wide audio entry points, splits bounty placed/received sounds, and uses the End Portal activation sound for large global bounty claims."
          fi
